name: Build ReSukiSU Manager

on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Download and place libksud.so
      run: |
        # 从 ReSukiSU_CI 下载包含 libksud.so 的压缩包
        curl -L -o ksud.zip https://github.com/cctv18/ReSukiSU_CI/releases/latest/download/ksud-aarch64-linux-android.zip
        # 解压并创建目标目录
        unzip ksud.zip
        mkdir -p manager/app/src/main/jniLibs/arm64-v8a/
        # 将 libksud.so 放到正确位置
        find . -name "libksud.so" -exec cp {} manager/app/src/main/jniLibs/arm64-v8a/ \;
        # 验证文件是否就位
        ls -la manager/app/src/main/jniLibs/arm64-v8a/libksud.so
        
    - name: Grant execute permission for gradlew
      run: chmod +x manager/gradlew
      
    - name: Build Release APK
      run: |
        cd manager
        ./gradlew assembleRelease --no-daemon
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ReSukiSU-Manager-APK
        path: manager/app/build/outputs/apk/release/*.apk
