name: Build ReSukiSU Manager

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          set +e
          mkdir -p "$ANDROID_HOME/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '84831b9409646161ce1e3aa002f926eac3954e5\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf 'd56f5187479451eabf01fb78af6dfcb131a6481e\n' >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "sdk.dir=$ANDROID_HOME" > manager/local.properties
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1
          echo "Installed platforms:"
          ls -1 "$ANDROID_HOME/platforms" || true

      - name: Generate signing keystore
        working-directory: manager
        run: |
          keytool -genkeypair \
            -alias resukisu \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=ReSukiSU CI" \
            -storetype JKS \
            -keystore key.jks
          {
            echo KEYSTORE_FILE=key.jks
            echo KEYSTORE_PASSWORD=android
            echo KEY_ALIAS=resukisu
            echo KEY_PASSWORD=android
          } >> gradle.properties

      - name: Verify native libs
        run: |
          ls -lh manager/app/src/main/jniLibs/arm64-v8a/
          test -s manager/app/src/main/jniLibs/arm64-v8a/libksud.so
          test -s manager/app/src/main/jniLibs/arm64-v8a/libghostlock.so

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Release APK
        working-directory: manager
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-Manager-APK
          path: manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
